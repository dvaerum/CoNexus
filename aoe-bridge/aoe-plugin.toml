# CoNexus delivery bridge — Agent of Empires plugin manifest.
#
# Schema reference: aoe-plugin-api (PluginManifest), docs/plugin-api.md.
# api_version 14 is required for the `sessions` dynamic_select option source (the
# session_id dropdown) and the `password` (masked) field type (the token field).
# 13 already covers the `session.mcp` capability / `session.mcp.set` RPC (the
# per-session-MCP host patch) and the `object_list` widget (≥9); 14 adds both
# field-type niceties. A pre-14 host emits an "upgrade aoe" message rather than
# an "unknown variant" error.

id = "dev.dvaerum.conexus-delivery"
name = "CoNexus Delivery Bridge"
version = "0.1.0"
api_version = 14
description = "Injects CoNexus delivery notifications into AoE-run sessions that don't poll wait_for_events (ADR-0021): subscribes to each covered session's delivery SSE stream, reports transport-status up, injects skinny (id/subject/status only) nudges via AoE's /send and /acp/prompt routes, and (optionally) wires conexus's tools into each covered session as a per-session MCP server."

# runtime.worker: run the worker at all, plus the config.get and ui.state.*
#                 host RPCs (ui.state.set is gated on runtime.worker + the
#                 `[[ui]]` declaration below, NOT on a capability of its own).
# session.read:   sessions.list, to enumerate live sessions + their status.
# session.mcp:    session.mcp.set, to inject conexus's tools per session.
# net:            outbound HTTP/SSE to conexus and AoE's localhost REST.
# notifications:  ui.notify, to surface bridge errors to the operator.
#
# UNCHANGED by the observability surface: the settings page needs only
# runtime.worker (already held), so the nix deploy's `grant.capabilities` needs
# no edit. The grant hash is derived from this file's bytes and updates itself.
capabilities = ["runtime.worker", "session.read", "session.mcp", "net", "notifications"]

# ---------------------------------------------------------------------------
# UI contributions
# ---------------------------------------------------------------------------
# The host gates `ui.state.set` on the (slot, id) pair being declared here
# (host_api.rs::require_declared_slot). `settings-page` is a GLOBAL slot, so one
# entry covers every session the bridge holds; the dashboard mounts it as its own
# entry in the Settings nav, labelled with this plugin's name.
#
# This is the bridge's only durable operator-facing surface. A worker's stderr
# goes to an unnamed per-spawn file nothing reads, and a `[[commands]]` invoke is
# fire-and-forget (202, no result channel) — so pushed UI state is the only way
# an operator can ask "is this session covered, and is delivery working?".
[[ui]]
slot = "settings-page"
id = "main"

# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------

# Invoked as a reply-less notification (`plugin.command.invoke`), so it cannot
# return anything: it forces an immediate repaint of the settings page above and
# toasts a one-line summary.
[[commands]]
id = "status"
title = "CoNexus Delivery: status"
description = "Refresh the delivery bridge's status page and toast a one-line summary."

# ---------------------------------------------------------------------------
# Settings — read by the worker over the config.get host RPC.
# ---------------------------------------------------------------------------

[[settings]]
key = "enabled"
label = "Enable delivery bridge"
description = "Master switch. When off, the worker holds no streams and reports no status."
type = "boolean"
default = true

# ── conexus side ──────────────────────────────────────────────────────────
# The ONE conexus URL to configure. Every per-session URL is derived from it:
#   delivery = <conexus_base>/api/<project>   (SSE stream + status POST)
#   mcp      = <conexus_base>/mcp/<project>   (injected per-session MCP server)
[[settings]]
key = "conexus_base"
label = "CoNexus base URL"
description = "The conexus router's base URL. Use the BARE address you reach it at — on the same host that's http://127.0.0.1:1337, with NO /conexus. The /conexus prefix is a reverse-proxy concern (a front door may serve the router under it externally); it does not belong in this base. The bridge derives each covered session's delivery URL (<base>/api/<project>) and MCP URL (<base>/mcp/<project>) from this plus the row's project. Blank ⇒ the bridge covers nothing."
type = "string"
default = ""

# ── AoE side (the injection target — a DIFFERENT service from conexus) ─────
[[settings]]
key = "aoe_base"
label = "AoE serve base URL (injection target)"
description = "Base URL of THIS AoE serve instance's REST API — where the bridge POSTs a nudge to inject it into a session (/api/sessions/<id>/send or /acp/prompt). This is the AoE side, not conexus."
type = "string"
default = "http://127.0.0.1:8080"

[[settings]]
key = "aoe_token"
label = "AoE serve token"
description = "Bearer token for THIS AoE serve instance (from ~/.agent-of-empires/serve.url), if it runs with auth. Leave blank for a --auth=none instance."
type = "string"
default = ""
advanced = true

[[settings]]
key = "status_interval_secs"
label = "Status/reconcile interval (seconds)"
description = "How often the bridge re-resolves routes and re-posts each session's transport-status."
type = "integer"
default = 30
min = 5
max = 3600
advanced = true

[[settings]]
key = "ensure_acp"
label = "Switch covered sessions to ACP mode"
description = "On (default): every covered session that gets conexus's tools injected (expose_mcp on) is also switched to ACP mode, so AoE's per-session MCP actually reaches the agent. Terminal claude/opencode sessions never load per-session MCP; ACP delivers it agent-agnostically. This is a one-time terminal→ACP view swap per session (transcript-preserving), applied only to sessions whose agent is ACP-capable. Off: sessions are left in their current mode and per-session MCP may not apply to terminal agents."
type = "boolean"
default = true

# ── Covered sessions ────────────────────────────────────────────────────────
# One row per session the bridge covers. A row is just identity — session_id,
# token, project — no URL (those derive from conexus_base above).
[[settings]]
key = "sessions"
label = "Covered sessions"
description = "Sessions the bridge covers. Each row is an AoE session id + the conexus token and project it acts as. The delivery and MCP URLs are derived from 'CoNexus base URL' + project, so there's no URL to enter here."
type = "object_list"
max_items = 200

[[settings.fields]]
key = "session_id"
label = "AoE session id"
description = "The session to cover. Pick from the live AoE sessions (label is '<title> (<id>)'); the stored value is the session id (stable across respawn), matching sessions.list[].id."
type = "dynamic_select"
option_source = "sessions"
required = true

[[settings.fields]]
key = "token"
label = "CoNexus token"
description = "The session's conexus bearer (mint one via conexus's Register Agent). Authenticates BOTH the delivery stream and the injected MCP tools. Masked in the UI."
type = "password"
required = true

[[settings.fields]]
key = "project"
label = "CoNexus project"
description = "The conexus project this session acts as. Appended to the global conexus base for both its delivery (/api/<project>) and MCP (/mcp/<project>) URLs."
type = "string"
required = true

[[settings.fields]]
key = "expose_mcp"
label = "Also inject CoNexus tools (MCP)"
description = "On: also wire conexus's tools into this session as a per-session MCP server. Off: delivery-push only. First enable respawns the session once (transcript-preserving) to load the tools."
type = "boolean"
default = true

[[settings.fields]]
key = "mode"
label = "Injection mode"
description = "How a nudge is delivered. auto infers terminal vs structured from the live session; set explicitly for ACP/CityHall/composer sessions."
type = "select"
options = ["auto", "terminal", "structured"]
default = "auto"

# ---------------------------------------------------------------------------
# Runtime worker — built from source into .aoe-build/ (excluded from the plugin
# integrity hash) and launched as a plugin-relative binary.
# ---------------------------------------------------------------------------

[runtime]
kind = "command"
command = [".aoe-build/target/release/aoe-bridge-worker"]

[[runtime.build]]
command = ["cargo", "build", "--release", "--target-dir", ".aoe-build/target"]
platforms = ["linux", "macos"]
