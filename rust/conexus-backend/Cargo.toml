[package]
name = "conexus-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus per-project MCP backend binary (Phase D1). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[[bin]]
name = "conexus-backend"
path = "src/main.rs"

[dependencies]
conexus-core = { path = "../conexus-core" }
conexus-db = { path = "../conexus-db" }
conexus-auth = { path = "../conexus-auth" }
conexus-tools = { path = "../conexus-tools" }
# SharedState::waiter_registry (Phase D3 wait_for_events).
conexus-wakeloop = { path = "../conexus-wakeloop" }
# Real (not dev) dependency: `main()`'s boot sequence must actually
# call `register_sqlite_vec()` for ANY connection this process opens
# to be able to query/write the `rag_embeddings` virtual table --
# found missing entirely (conexus-db only carries this as a
# dev-dependency for its own repository tests, on the documented
# assumption that "production rag_repository code never calls into
# conexus-vec itself" is the whole story; the real gap was that
# nothing else ever assumed the OTHER half -- actually registering the
# extension at boot -- either).
conexus-vec = { path = "../conexus-vec" }
rusqlite = { version = "0.32", features = ["bundled"] }
# SharedState::sea_orm_db (Phase G) -- opened once at boot alongside
# the existing rusqlite connection, threaded into every real
# ToolCallContext. Matches conexus-db's own sea-orm entry exactly
# (same version/features).
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# CLI flag parsing -- matches the real invocation contract
# nix/packages.nix's wrapper generates (--uds/--project-dir/
# --forwarding-hmac-in/--no-tui/--transport). New dependency for this
# repo's Rust workspace, but the standard/idiomatic choice -- both
# sibling repos (pikvm_mcp_server, m365-bridge) already use it for
# their own MCP binaries' CLI surface.
clap = { version = "4", features = ["derive"] }
# Top-level error handling for the binary -- matches aoe-bridge's own
# convention elsewhere in this repo (`anyhow` at the binary boundary;
# the library crates below it keep their own targeted Result types).
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# rmcp pinned EXACTLY (not "3.x"): the Phase 0 transport spike found 3.2.0
# changing APIs this crate uses (CallToolResponse return shape, deprecated
# Logging notifications, structs went #[non_exhaustive]) -- see
# docs/learnings/rust-migration-mcp-transport-spike.md. 3.9.0 is the first
# release past RUSTSEC-2026-0457/0461/0462 and built with no source changes.
# "server" + "transport-streamable-http-server" only -- no "macros"
# feature, since Tool registration is hand-written
# (conexus-tools::all_tools()) per the migration plan's explicit
# rejection of proc-macro/inventory::submit! auto-collection.
rmcp = { version = "=3.9.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
# GET /api/events's SSE loop (Phase E1 PR 13/14, operator_events) --
# `stream::unfold` builds the pull-based Stream axum::response::sse::Sse
# needs from RevalidatingStream::next_slice's own pull-based API,
# without a proc-macro (async-stream) this workspace has no other use
# for. Already resolved workspace-wide at 0.3.34 (a transitive dep of
# tokio/hyper/rmcp) -- adding it directly changes no version, just the
# dependency edge.
futures-util = "0.3"
# RAG periodic indexer's content-hash watermark (background_tasks::
# rag_indexing) -- same version this workspace already resolves
# (conexus-auth/conexus-db/conexus-router all pin "0.10" for the
# identical reason: dedup to one resolved sha2, don't add a second).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# "client" -- integration tests drive requests over a real UnixStream
# via hyper's own client, the only realistic way to exercise the UDS
# accept loop end-to-end without an extra Unix-socket connector crate.
hyper = { version = "1", features = ["http1", "server", "client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "process"] }
