<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}conexus{% endblock %}</title>
  <style>
    /* Minimal "shows up; not pretty" CSS for Phase 1.
       Inline so we don't need a static-asset round-trip on the login
       path. Replaced wholesale when the dashboard auth migration lands
       in PR D (operators will see the React dashboard after login). */
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 28rem;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label {
      display: block;
      margin-top: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #333;
    }
    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1rem;
      background: #2563eb;
      color: #fff;
      border: 0;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1d4ed8; }
    .error {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 4px;
      color: #900;
      font-size: 0.875rem;
    }
    .hint {
      margin-top: 1rem;
      color: #666;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
