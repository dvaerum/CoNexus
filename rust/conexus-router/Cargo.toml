[package]
name = "conexus-router"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus always-on URL-keyed router binary (Phase E2). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[lib]
name = "conexus_router"
path = "src/lib.rs"

[[bin]]
name = "conexus-router"
path = "src/main.rs"

[dependencies]
# Guiding Principle 2 / ADR-0020: NEVER conexus-tools or conexus-mcp,
# so the router stays structurally incapable of importing a tool type
# (a compile-time guarantee of "the router is mount-agnostic", not
# just a convention).
conexus-core = { path = "../conexus-core" }
conexus-db = { path = "../conexus-db" }
# RouterState::sea_orm_db (Phase G, router step 4 PR B) -- a second,
# sea-orm-flavored handle opened onto the SAME router SQLite file the
# existing rusqlite `conn` already targets. Threaded ahead of its
# first real consumer, same "helpers ahead of their first consumer"
# precedent this file's own doc comment already uses elsewhere.
# Matches conexus-db's/conexus-backend's own sea-orm entry exactly
# (same version/features).
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
# session_gate.rs (Phase E2 PR 12) is the FIRST real consumer:
# resolve_capabilities()/Principal construction at the operator-
# session seam, exactly the "conexus-auth ONLY, never conexus-tools/
# conexus-mcp" dependency this crate's Target Architecture always
# scoped for -- not a scope creep.
conexus-auth = { path = "../conexus-auth" }
# "process" (Phase E2 PR 6b): orchestrator/primitives.rs shells out to
# `systemctl` via `tokio::process::Command` -- more idiomatic than
# `std::process::Command` + `spawn_blocking` given this binary is
# already `#[tokio::main]`/`rt-multi-thread`; no existing workspace
# precedent for shelling out at all, so this is a fresh choice, not a
# fork resolution.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# identity.rs's password hashing (Phase E2 PR 3) -- the RustCrypto
# project's own argon2 crate, matching Python's argon2-cffi's library
# defaults (argon2id, t=2, m=64MiB, p=4) and producing/parsing the
# same PHC string format, so a hash minted by one implementation
# verifies under the other. No existing workspace precedent for this
# choice (same "genuinely new, no fork to resolve" shape as the
# crane-vs-buildRustPackage pick in Phase D1).
argon2 = "0.6"
# session_id/user_id generation -- same OS-CSPRNG source
# `conexus-tools::admin_tools::generate_token` already uses.
getrandom = "0.4"
# project_registry.rs (Phase E2 PR 5) needs the raw JSON map shape
# Python's `dict[str, Any]` gives it (to round-trip opaque `extra`
# fields on a read-modify-write cycle without a schema) plus its slug
# validation regex -- both already workspace dependencies elsewhere
# (conexus-core/conexus-tools use serde_json; conexus-db uses regex),
# added here directly rather than routed through another crate's
# private re-export.
serde_json = "1"
regex = "1"
# Advisory cross-process file locking for the registry's sidecar
# lockfile (`<path>.lock`) -- ports `fcntl.flock`'s LOCK_EX/LOCK_SH
# semantics. No existing workspace precedent for this choice (same
# "genuinely new, no fork to resolve" shape as the argon2 pick in
# PR 3): `fd-lock` is small, actively maintained, and its `RwLock`
# read/write split maps directly onto LOCK_SH/LOCK_EX.
fd-lock = "4"
# Atomic registry-file rewrite (tmp-in-same-dir + fsync + rename) --
# same crate+version already used by identity.rs's own create_user
# race test (see below), here as a REAL (not dev) dependency since
# production code needs it, not just tests.
tempfile = "3"
# orchestrator/runtime.rs's per-(name, role) ensure-lock registry
# (Phase E2 PR 6a) needs an ATOMIC get-or-insert-of-a-lock -- a plain
# `Mutex<HashMap<K, Arc<Mutex<()>>>>`'s "read, maybe insert" is a
# real TOCTOU here (unlike `WaiterRegistry`'s own `Mutex<HashMap<...>>`
# elsewhere in this workspace, which never races two callers creating
# DIFFERENT channel instances for the same key). No existing workspace
# precedent for this choice (same "genuinely new, no fork to resolve"
# shape as the argon2/fd-lock picks in PRs 3/5); `dashmap` is the
# de facto standard for exactly this shape.
dashmap = "6"
# proxy_client.rs (Phase E2 PR 7) -- the UDS-dialing HTTP client
# primitive `conexus-backend::uds.rs` doesn't provide (that module is
# server-side only). Matches the exact hyper-over-UnixStream pattern
# already PROVEN in this workspace as a test-only tool
# (`conexus-backend`'s own dev-dependency `hyper` "client" feature,
# used to drive its UDS accept loop end-to-end) -- this promotes that
# pattern into a real production primitive rather than picking a new
# HTTP-client crate; no off-the-shelf client (reqwest included) speaks
# Unix sockets without an extra connector crate. `hyper-util`/
# `http-body-util`/`bytes` are all already resolved workspace-wide
# (transitive deps of axum/hyper), added here as direct edges only.
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# proxy_core.rs (Phase E2 PR 8) -- the stream-cap admission key hashes
# a bearer token the same way `conexus-db`'s repositories already hash
# things elsewhere in this workspace; same crate+version.
sha2 = "0.10"
# Adapts hyper::body::Incoming's frame stream into a plain byte
# stream for SSE pass-through -- already resolved workspace-wide
# (conexus-backend's own GET /api/events SSE loop uses stream::unfold
# from the same crate).
futures-util = "0.3"
# session_gate.rs (Phase E2 PR 12) -- the login-redirect's `?next=`
# deep-link needs Python's `urllib.parse.quote(safe="/")` percent-
# encoding exactly; already resolved workspace-wide (a transitive dep
# of `url`/`reqwest`), added here as a direct edge rather than
# hand-rolling a second escaper (this crate's own established
# "well-maintained library over reinventing it" discipline).
percent-encoding = "2"
# templates.rs (step 4, `conexus-router-login-setup-templates`) --
# operator decision 2026-09-06: Jinja2-syntax-compatible over askama
# (a different, Rust-native macro syntax that would mean REWRITING
# the existing `conexus/router/templates/*.html` files rather than
# PORTING them) or hand-written `format!` HTML (autoescaping stays
# structural instead of relying on every future editor remembering to
# escape a new field). Same author as Jinja2 itself (Armin Ronacher).
# Default features only -- no filesystem loader needed (templates are
# `include_str!`'d at compile time), no `speedups`/`stacker`.
minijinja = "2"
# login_setup_rest.rs's `Form<LoginFormBody>`/`Form<SetupFormBody>`
# extractors need `Deserialize` -- already resolved workspace-wide
# (a transitive dep of axum/serde_json), added here as a direct edge
# for the `derive` feature.
serde = { version = "1", features = ["derive"] }
# oidc_flow_state.rs (Phase E2 PR22 step 6, `conexus-router-oidc-
# flow-state`) -- base64url(JSON) encode/decode for the SSO flow-state
# cookie. Already resolved workspace-wide (a transitive dep of
# argon2/password-hash), added here as a direct edge rather than
# hand-rolling a second base64 codec (this crate's own established
# "well-maintained library over reinventing it" discipline).
base64 = "0.22"
# oidc_http_client.rs (Phase E2 PR22 step 5, `conexus-router-oidc-
# http-client`) -- operator decision 2026-09-06: the full
# `openidconnect` crate (wraps `oauth2-rs`, same maintainer) over a
# hand-rolled auth-code flow + a decode-only JWT crate. The flow has
# several correctness-critical steps (PKCE, state/nonce CSRF, JWKS
# fetch/cache/rotation, issuer/audience/expiry validation) this
# project's own "lean on well-maintained libraries for security-
# relevant logic" norm (Phase B precedent) says not to hand-roll.
openidconnect = "4"
# The crate's own BYO-http-client design (no bundled transport as of
# 4.x) -- `reqwest` is already resolved workspace-wide (conexus-tools'
# RAG clients, Phase D2), added here as a direct edge with the same
# rustls-tls feature set for consistency (avoids a second, OpenSSL-
# linked TLS stack in the same binary).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# oidc_http_client.rs's OBS-R17-SSO origin-pin needs real URL scheme/
# host/port accessors -- already resolved workspace-wide (a
# transitive dep of openidconnect/reqwest), added here as a direct
# edge for the same reason as `base64` above.
url = "2"

[dev-dependencies]
# oidc_handlers.rs's end-to-end test (Phase E2 PR22 step 7) needs to
# MINT a real RS256-signed ID token to prove `IdToken::claims()`
# verification actually succeeds -- `openidconnect` is a relying-
# party (verify-only) library and exposes no signing API. Dev-only:
# never shipped in the router binary. Signs against the RFC 7520
# ("bilbo.baggins@hobbiton.example") test keypair -- a published IETF
# spec example, not a secret, and the same fixture `openidconnect`'s
# own test suite uses for its public-key half.
jsonwebtoken = "9"
# login_setup_rest.rs's own HTTP-level tests (test_sec_router_login_
# setup_group_3, PR 3/13 of the test_sec_* router port) drive a real
# axum::Router end to end via `ServiceExt::oneshot` -- proving the
# FULL handler (extraction, same-origin check, credential check,
# status/cookie) rather than only the pure decision-function half
# `login.rs`'s own unit tests already cover. Already resolved
# workspace-wide at this exact version (a transitive dep of axum
# itself), added here as a direct dev-only edge for the `util`
# feature (`ServiceExt`) rather than adding a heavier
# request-building crate (`axum-test`, not otherwise needed anywhere
# in this workspace).
tower = { version = "0.5", default-features = false, features = ["util"] }

