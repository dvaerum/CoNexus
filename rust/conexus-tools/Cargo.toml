[package]
name = "conexus-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus MCP tool catalogue -- one module per conexus/tools/*.py (Phase D). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[dependencies]
conexus-core = { path = "../conexus-core" }
conexus-db = { path = "../conexus-db" }
conexus-auth = { path = "../conexus-auth" }
# ToolCallContext::off_wire needs a real WaiterRegistry instance (every
# tool test constructs one, even tools that ignore the context); the
# upcoming wait_for_events tool (Phase D3) will be a real, non-test
# user of this dependency too.
conexus-wakeloop = { path = "../conexus-wakeloop" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
regex = "1"
# wait_for_events's slow-path loop needs fresh wall-clock ISO
# timestamps as real time passes during its (potentially hours-long)
# hold -- see agent_communication_tools.rs's own doc on why this is
# the one deliberate exception to "explicit input, never read the
# clock". default-features off + only "clock": matches
# conexus-backend's own chrono usage for the same "generate now"
# purpose.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Tool::call takes `&tokio::sync::Mutex<Connection>` (see
# conexus_auth::tool's module doc) -- every impl here locks it as the
# first step of its own async body.
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
# RAG's embedding/completion/context-window HTTP calls (Phase D2). Same
# feature set as this repo's own aoe-bridge/Cargo.toml (rustls-tls:
# AoE deliberately avoids an OpenSSL system dependency; that reasoning
# applies here too).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
] }
# admin_tools' register_agent/rotate_agent_token bearer-token generator
# (Phase D5, PR 9.1) -- Python's `secrets.token_hex(16)` reads straight
# from `os.urandom`; `getrandom` IS that same OS-CSPRNG call (it's the
# crate `rand`'s own `OsRng` is built on), used directly instead of
# pulling in the rest of `rand`'s API surface for one 16-byte fill.
getrandom = "0.4"
hex = "0.4"
# Phase G PR 5: `project_context_tools.rs`'s `check_write_authorization`/
# `single_update_project_context`/`bulk_update_project_context_entries`
# helpers spell `sea_orm::DatabaseConnection` out directly in their own
# signatures (rather than only forwarding `ctx.sea_orm_db` through, the
# way every earlier converted tool in this crate does) -- this crate's
# first real production code naming the `sea_orm` crate directly, not
# just a test helper's signature. Promoted out of dev-dependencies for
# exactly that reason; matches conexus-db's own sea-orm entry.
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

[dev-dependencies]
# Union of both features sets that need a runtime in tests: driving an
# async Tool::call/dispatch ("rt", "macros") and the embedding/
# completion/context-window probe tests' real bound TCP listeners
# ("rt-multi-thread", "net", "io-util") -- "rt-multi-thread" is a
# superset of "rt" so only one is listed. "test-util" drives
# wait_for_events's slow-path loop tests through virtual time
# (`#[tokio::test(start_paused = true)]` + `tokio::time::advance`) --
# this crate's first real user of it (`stream_gates.rs` enabled the
# feature but never exercised it -- see this module's own tests).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "test-util",
] }
# backup_project_context (Phase D5) is this crate's first tool that
# writes a real file to disk -- an isolated real tempdir per test,
# same crate `conexus-backend` already uses for its own boot tests.
tempfile = "3"
