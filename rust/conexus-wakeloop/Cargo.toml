[package]
name = "conexus-wakeloop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus wake-loop support primitives -- one module per conexus/core/{hold_ladder,client_hold_strategy,idle_reminder,stream_gates}.py plus the waiter registry (Phase D3). New crate, sitting between conexus-auth and conexus-tools: wait_for_events (a conexus-tools Tool) depends on these; conexus-mcp's later rmcp/Peer transport wiring is a separate, higher-level concern these modules don't need. See /home/dennis/.claude/plans/prancy-napping-pie.md."

[dependencies]
conexus-core = { path = "../conexus-core" }
conexus-db = { path = "../conexus-db" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RevalidatingStream's bounded wait (stream_gates.rs).
tokio = { version = "1", features = ["sync", "time"] }
# Phase G async-plumbing prerequisite: `event_feed::assemble_event_feed`
# takes a `&sea_orm::DatabaseConnection` parameter it doesn't read from
# yet (see that function's own doc comment) -- a real dependency, not
# dev-only, since the parameter is in this crate's own production
# signature. Matches conexus-db's/conexus-tools' own sea-orm entry.
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

[dev-dependencies]
# Tests drive RevalidatingStream's real bounded waits.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
# `event_feed`'s tests need a real temp-file-backed sea-orm connection
# for pending_directive_repository (Phase G) -- :memory: has no schema
# and isn't shared across separate connections.
tempfile = "3"
