[package]
name = "conexus-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CoNexus data layer — unifies conexus's 8 Python repositories into one rusqlite crate (Phase B). See /home/dennis/.claude/plans/prancy-napping-pie.md."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off + only "std": this crate never reads the wall
# clock (see agent_repository.rs's module doc on that design rule) --
# chrono is used purely for ISO-8601 parsing/arithmetic/formatting in
# scheduled_directive_repository's interval math, not Utc::now().
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Minimal OS-CSPRNG wrapper (the actual backbone `rand` itself builds
# on) for generate_task_id -- we only need N random bytes to hex-encode,
# not a full PRNG/distribution library.
getrandom = "0.4"
# Phase G (see the plan's own "Full sea-orm migration" section): the
# `entity/` module's `Model`/`ActiveModel` structs are real production
# types other crates will construct once repository rewrites land
# (PR 2+) -- kept a real dependency, not dev-only, even though THIS PR
# only defines Entities and doesn't yet rewrite a repository to use
# them. `macros` (default) for `DeriveEntityModel`; `sqlx-sqlite` +
# `runtime-tokio-rustls` matches this workspace's existing TLS/runtime
# choice (`conexus-tools`'s `reqwest` also uses rustls).
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
# Phase F (schema-authority replacement, see the plan's own
# "Migration-tool detail: sea-orm-migration" decision -- this
# operator-decided replacement for Alembic, not a design still to be
# picked). Same feature set as `sea-orm` above; `sea-orm-migration`
# re-exports its own pinned `sea-orm` internally, so the version here
# must track it (see this crate's own migration module doc for the
# exact compatibility note once verified).
sea-orm-migration = { version = "2", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
# Phase G PR 5: `project_context_repository` is the first repository
# genuinely rewritten onto sea-orm, and `bin/conexus-db-differential.rs`
# -- a real production binary, not a test -- drives it directly, so a
# real async runtime is now needed to BUILD this crate, not just test
# it. Promoted out of dev-dependencies (where it lived for Phase G PR
# 1's entity round-trip tests only) for exactly that reason.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Only needed to register the real sqlite-vec extension for THIS
# crate's own rag_repository tests -- production rag_repository code
# never calls into conexus-vec itself (it only checks whether
# `rag_embeddings` exists in sqlite_master, a plain SQL query), so
# this stays a dev-dependency, not a real one.
conexus-vec = { path = "../conexus-vec" }
tempfile = "3"

[[bin]]
name = "conexus-db-differential"
path = "src/bin/conexus-db-differential.rs"
