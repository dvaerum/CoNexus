name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo (checkout,
# build, test) and never writes back, so drop the default read/write grant.
permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    # Replaces the former `python` job's real remaining content once
    # the last Python source was deleted (this doc's own prior version
    # tracked that job down to "a clean __init__.py plus the dashboard
    # frontend, with no real Python-version sensitivity left" -- the
    # honest conclusion was there was nothing left worth a Python
    # interpreter for at all). What that job's pytest suite actually
    # covered by then -- Nix eval/build regression guards, a bash
    # daemon-agent hook's URL-derivation contract, a .gitignore
    # collision guard -- is real, permanent coverage with no
    # Python-specific dependency; ported to plain bash
    # (`nix/tests/checks/*.sh`) matching this repo's own established
    # Nix idiom (shell scripts, not a second language) rather than
    # kept on a pytest harness with nothing left to justify it. The
    # dashboard-source regression guards (the other half of that old
    # suite) moved to vitest instead -- see the `dashboard` job below,
    # which already runs `npm test`.
    name: Nix checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            download-attempts = 3
            connect-timeout = 10

      - name: Run nix/tests/checks
        run: bash nix/tests/checks/run-all.sh

  aoe-bridge:
    # The AoE delivery-bridge plugin worker (ADR-0021). It is a standalone
    # crate consumed by the nix deploy as a flake-input source path, so nothing
    # else in this workflow compiles it — without this job a Rust change ships
    # unverified and only breaks at `nixos-rebuild` time (the deploy's crane
    # build runs `doCheck`, i.e. these same tests, but hours later).
    name: aoe-bridge (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aoe-bridge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        # `stable` satisfies the crate's declared rust-version floor (1.85).
        # `rustup default` pins what bare `cargo` resolves to, so fmt/clippy
        # cannot silently run under a different toolchain than the tests.
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aoe-bridge/target
          key: aoe-bridge-${{ runner.os }}-${{ hashFiles('aoe-bridge/Cargo.lock') }}
          restore-keys: aoe-bridge-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install cargo-audit
        # taiki-e/install-action fetches a prebuilt binary instead of
        # compiling cargo-audit from source, keeping this step seconds
        # rather than minutes.
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-audit

      - name: Audit (cargo-audit)
        # R3-F2: aoe-bridge (140 transitive crates) had no dependency-audit
        # coverage — Python (pip-audit) and the dashboard (npm audit) both
        # already gate on advisories, Rust did not. Fails on ANY advisory in
        # the locked tree, same fail-on-any posture as pip-audit below (no
        # --audit-level knob to soften it, unlike npm audit's HIGH/CRITICAL
        # threshold). No allowlist file exists yet — if an unfixable
        # advisory ever needs one, add it with a documented rationale the
        # way nix/audit/closure-advisory-allowlist.toml does for the
        # nix-closure gate, not a silent --ignore.
        run: cargo audit

  conexus:
    # Phase 0 CI seam for the Python->Rust migration (see
    # /home/dennis/.claude/plans/prancy-napping-pie.md). The CoNexus Rust
    # workspace under rust/ — same fmt/clippy/test/audit shape as
    # aoe-bridge's job above, cloned deliberately rather than parameterized
    # into one job: the two crates have unrelated release cadences and a
    # shared job would couple their caches/failures for no benefit.
    name: conexus (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: conexus-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: conexus-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-audit

      - name: Audit (cargo-audit)
        run: cargo audit

  dashboard:
    # Job display name is load-bearing: branch protection matches
    # required status checks by name, so renaming it would silently stop
    # satisfying an existing requirement. The added vitest step is a
    # step-level change on purpose.
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conexus/dashboard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conexus/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Vitest suite was ungated until fix/vitest-notifications-flake,
      # which is exactly why a testTimeout bump papering over two real
      # timer/import defects went unnoticed for a release: nothing outside
      # a developer's own terminal ever ran it. `npm run build` only
      # typechecks — it cannot catch a leaked timer, a lost SSE contract,
      # or a source-grep guard going stale.
      #
      # Cost is ~20s on top of a job that already pays for `npm ci`, so it
      # runs BEFORE the (much slower) build for fast feedback.
      - name: Unit tests (vitest)
        run: npm test

      # ESLint is a real gate now (Wave 2 — dashboard quality gates).
      # `next build` also lints (next.config.ts no longer sets
      # eslint.ignoreDuringBuilds), but running it as its own step gives
      # a clear, fast signal that names lint separately from the build.
      - name: Lint (dashboard)
        run: npm run lint

      - name: Build static export
        run: npm run build

      # A dead `@import "some-pkg/x.css";` in globals.css (referencing
      # a package that's since been removed from package.json) is NOT
      # a build failure: webpack prints the unresolvable-import error
      # as diagnostic output but `next build` still exits 0 and still
      # prints "Compiled successfully" — it just silently emits a
      # 0-byte production CSS bundle instead of the real one. This
      # shipped straight to the internet-facing production dashboard
      # (every page rendered as unstyled plain HTML) because nothing
      # else in this job would catch it: `npm test` doesn't render
      # globals.css, `npm run lint` doesn't check CSS output size, and
      # the build step above treats a 0-byte artifact as success.
      # tests/test_dashboard_css_imports_resolve.py (Python static
      # source check) catches the specific "stale @import" shape of
      # this bug ahead of a build; this step is the build-level
      # backstop that catches ANY cause of a near-empty CSS bundle
      # (a broken Tailwind/PostCSS config, a bad plugin, a future
      # variant of the same import mistake) — the two are
      # complementary, not redundant.
      - name: Verify CSS bundle is not empty
        run: |
          css_files=(out/_next/static/css/*.css)
          if [ ! -e "${css_files[0]}" ]; then
            echo "::error::No CSS output file found under out/_next/static/css/ — the build produced zero stylesheet chunks."
            exit 1
          fi
          for f in "${css_files[@]}"; do
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 10000 ]; then
              echo "::error::$f is only $size bytes (expected >10000) — this is exactly the failure mode that shipped a completely unstyled dashboard to production (see tests/css-imports-resolve.test.ts and docs/learnings/next-build-swallows-unresolvable-css-import.md)."
              exit 1
            fi
          done

  nix-flake-check:
    # Sharded: each of the four nixosTest VMs builds on its own runner in
    # parallel, so the job's wall-clock is a single VM (~4-6 min warm)
    # instead of four serialized on one runner (~9 min). fail-fast:false
    # so one VM's failure still lets the others report. All four stay
    # gated so a VM check can't silently rot (event-driven-coord +
    # no-auto-cleanup were previously ungated and drifted — see #489). The
    # VM checks exercise the full server boot + HTTP assertions (including
    # the Path A asset-prefix sentinel regression guard from #166) which
    # nothing else covers. The conexus Python build + dashboard Next.js
    # build are NOT gated here — the `python` and `dashboard` jobs above
    # cover those.
    name: Nix VM (${{ matrix.vm }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vm:
          - vm-single-tenant
          - vm-multi-tenant
          - vm-event-driven-coord
          - vm-no-auto-cleanup
          - vm-module-parity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Pinned to a release tag instead of the mutable @main for
      # reproducible runs; v22 runs on node24.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Resilience: retry transient substituter/network hiccups
          # before giving up, rather than failing the job on the first
          # flaky download from cache.nixos.org. Pairs with --fallback
          # on the build step below.
          #
          # auto-allocate-uids/uid-range/cgroups: vm-multi-tenant runs as
          # a systemd-nspawn container (nix/tests/multi-tenant.nix), not
          # a QEMU node. The nixpkgs manual's nspawn "System Requirements"
          # section documents these three daemon settings as mandatory —
          # without them the container-test derivation fails eval with
          # "feature 'uid-range' requires the setting 'auto-allocate-uids'
          # to be enabled" before a single VM/container even boots.
          # `extra-` prefixes append rather than clobber the installer's
          # own experimental-features/system-features defaults. Harmless
          # for the other 3 (QEMU) shards in this matrix.
          extra-conf: |
            download-attempts = 3
            connect-timeout = 10
            auto-allocate-uids = true
            extra-system-features = uid-range
            extra-experimental-features = auto-allocate-uids cgroups

      # magic-nix-cache is sunset by Determinate Systems (it also spammed
      # an "Unable to authenticate to FlakeHub" annotation on every run)
      # and, when GitHub Actions Cache throttled it, disabled the
      # substituter mid-build and hard-failed the job (HTTP 418 /
      # ResourceExhausted). cache-nix-action save/restores /nix/store via
      # the plain Actions cache API instead, with GC so we stay under the
      # 10 GB per-repo cache budget. No external account or secret needed.
      - name: Cache /nix/store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Per-VM cache lineage: each shard keys on ``matrix.vm`` so the
          # four parallel shards don't collide on one shared ``run_id``
          # key, and each cache holds only its own VM closure.
          primary-key: nix-${{ runner.os }}-${{ matrix.vm }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}-${{ github.run_id }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.vm }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}-
          # Trim each shard's store to ~3 GB before saving so the four
          # per-VM lineages stay near the 10 GB per-repo budget. If GitHub
          # LRU-evicts one, that shard just re-substitutes from
          # cache.nixos.org next run (still faster than the un-sharded job).
          gc-max-store-size-linux: 3G
          # Keep each lineage bounded: drop this VM's older entries, but
          # never the key we're about to save. Scoped to the per-VM prefix
          # so one shard's purge never evicts a sibling VM's cache.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.vm }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build VM test
        # --fallback: if a binary-cache substitution fails (flaky
        # cache.nixos.org), build that path from source instead of
        # hard-failing the job. With download-attempts=3 above, this
        # makes the shard resilient to transient cache failures — the
        # class of flake that sank the old magic-nix-cache setup.
        run: |
          nix build .#checks.x86_64-linux.${{ matrix.vm }} \
                    -L --print-build-logs --fallback

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Python's own pip-audit leg (against the uv-locked dependency
      # tree) was removed here once the last Python dependency was
      # deleted along with the last Python source file -- there was no
      # tree left to export or audit. Rust (cargo-audit, aoe-bridge/
      # conexus jobs above) and the dashboard (npm audit, below) both
      # already have their own dedicated advisory gates; this job is
      # npm-only now.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conexus/dashboard/package-lock.json

      - name: npm audit (dashboard deps)
        working-directory: conexus/dashboard
        # Gate on HIGH/CRITICAL only. Moderate/low advisories are surfaced
        # by Dependabot and its bump PRs but must not red the build on the
        # committed lockfile (currently 2 known moderate postcss/next
        # advisories). Raise the threshold here if that tolerance changes.
        #
        # Retry the audit call itself: registry.npmjs.org's audit
        # endpoint has genuinely 500'd/503'd mid-run twice in one week
        # (2026-09-04, PRs #788 and #789 — "npm warn audit 500 Internal
        # Server Error" / "503 Service Unavailable" from
        # POST .../security/audits/quick, both while npm ci itself
        # succeeded moments earlier), redding otherwise-green PRs on a
        # transient third-party outage rather than a real advisory.
        # `npm ci` is NOT retried — it wasn't the failure in either
        # incident, and its own registry calls are already covered by
        # actions/setup-node's package cache on a re-run.
        run: |
          npm ci
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            echo "npm audit attempt ${attempt}/3 failed" >&2
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "npm audit failed 3/3 attempts" >&2
          exit 1
